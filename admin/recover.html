<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recuperar acesso</title>
    <style>
      body { font-family: system-ui, Arial; padding: 24px; }
      .box { max-width: 520px; margin: 0 auto; }
      a { color: #1f6feb; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Redirecionando…</h2>
      <p>Se não redirecionar automaticamente, <a id="go" href="/admin/">clique aqui</a>.</p>
    </div>

    <script>
      // Netlify Identity coloca tokens no hash (#...)
      // A tela do Decap/Netlify CMS entende esses tokens no /admin/
      if (location.hash && location.hash.includes('recovery_token=')) {
        location.replace('/admin/' + location.hash);
      } else {
        location.replace('/admin/');
      }
    </script>
  </body>
</html>
