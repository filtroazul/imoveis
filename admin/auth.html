<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Acesso do Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      body{font-family:system-ui,Arial;padding:28px;background:#0b0f16;color:#fff}
      .box{max-width:560px;margin:0 auto}
      a{color:#7dd3fc}
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Acesso do Admin</h2>
      <p>Use esta tela para aceitar convite, criar senha, fazer login e resetar senha.</p>
      <p>Depois disso, abra <a href="/admin/">/admin</a>.</p>
    </div>

    <script>
      netlifyIdentity.on('init', () => netlifyIdentity.open());
      netlifyIdentity.init();
    </script>
  </body>
</html>
