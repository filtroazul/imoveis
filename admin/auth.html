<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Acesso do Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      body{font-family:system-ui,Arial;padding:28px;background:#0b0f16;color:#fff}
      .box{max-width:560px;margin:0 auto}
      a{color:#7dd3fc}
      button{padding:12px 16px;border-radius:10px;border:0;background:#22c55e;color:#0b0f16;font-weight:700;cursor:pointer}
      .hint{opacity:.8;margin-top:14px}
      code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Acesso do Admin</h2>
      <p>Use esta tela para aceitar convite, criar senha, fazer login e resetar senha.</p>

      <p><button id="openBtn" type="button">Abrir Login / Criar senha</button></p>

      <p class="hint">
        Se não abrir nada, desative o bloqueador (Brave Shields/Adblock) para <code>ahimoveis.netlify.app</code>.
      </p>

      <p>Depois disso, abra <a href="/admin/">/admin</a>.</p>
    </div>

    <script>
      function openWidget() {
        if (window.netlifyIdentity) {
          window.netlifyIdentity.open();
        } else {
          alert("Widget do Netlify Identity não carregou. Verifique bloqueador (Brave/Adblock).");
        }
      }

      document.getElementById('openBtn').addEventListener('click', openWidget);

      // força abrir após carregar
      window.addEventListener('load', () => {
        setTimeout(openWidget, 300);
      });
    </script>
  </body>
</html>
