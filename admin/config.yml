backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

media_library:
  name: uploadcare

collections:
  - name: "catalogo"
    label: "Catálogo"
    files:
      - name: "imoveis"
        label: "Imóveis"
        file: "content/imoveis.json"
        format: "json"
        fields:
          - label: "Lista de imóveis"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.badge}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Badge", name: "badge", widget: "select", options: ["Destaque", "Novo", "Alto Padrão", "Locação", "Exclusivo", "Moderno"] }
              - { label: "Imagem (URL Cloudinary)", name: "img", widget: "string", hint: "Cole a URL do Cloudinary (image/upload/...)" }
              - { label: "Preço", name: "price", widget: "string" }
              - { label: "Tipo", name: "type", widget: "select", options: ["Venda", "Aluguel"] }
              - { label: "Localização", name: "location", widget: "string" }
              - { label: "Área", name: "area", widget: "string", required: false }
              - { label: "Quartos", name: "rooms", widget: "string", required: false }
              - { label: "Disponibilidade", name: "date", widget: "string", required: false }
              - { label: "Condomínio", name: "condo", widget: "string", required: false }
              - { label: "Destaques (features)", name: "features", widget: "list", required: false }
              - { label: "Descrição", name: "desc", widget: "text", required: false }
              - { label: "Vídeo (URL opcional)", name: "video", widget: "string", required: false }
              - { label: "Publicado?", name: "published", widget: "boolean", default: true }
